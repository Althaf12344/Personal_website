<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#p1bg)"/>
  
  <!-- Neural graph connections -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="4 4">
    <line x1="80" y1="90" x2="200" y2="150"/>
    <line x1="80" y1="210" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="320" y2="90"/>
    <line x1="200" y1="150" x2="320" y2="210"/>
    <line x1="320" y1="90" x2="420" y2="150"/>
    <line x1="320" y1="210" x2="420" y2="150"/>
  </g>

  <!-- Multimodal tokens -->
  <g fill="#1e293b" stroke="#38bdf8" stroke-width="2">
    <rect x="50" y="70" width="60" height="40" rx="8"/>
    <text x="80" y="95" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">Vision</text>
    
    <rect x="50" y="190" width="60" height="40" rx="8"/>
    <text x="80" y="215" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">Text</text>
  </g>

  <!-- Central Reasoning Core -->
  <circle cx="200" cy="150" r="42" fill="#1e1b4b" stroke="url(#glow1)" stroke-width="3"/>
  <text x="200" y="145" fill="#e0e7ff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Latent</text>
  <text x="200" y="162" fill="#818cf8" font-family="sans-serif" font-size="11" text-anchor="middle">Reasoning</text>

  <!-- Output tokens -->
  <g fill="#1e293b" stroke="#a855f7" stroke-width="2">
    <rect x="290" y="70" width="60" height="40" rx="8"/>
    <text x="320" y="95" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">Plan</text>
    
    <rect x="290" y="190" width="60" height="40" rx="8"/>
    <text x="320" y="215" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">Action</text>
  </g>

  <rect x="390" y="130" width="60" height="40" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="420" y="155" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">Goal ✓</text>

  <rect x="15" y="15" width="130" height="24" rx="4" fill="#0369a1"/>
  <text x="80" y="31" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">NeurIPS 2026 Oral</text>
</svg>
