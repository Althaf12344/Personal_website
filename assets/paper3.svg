<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#p3bg)"/>
  
  <!-- 3D Coordinate grid & point cloud / Gaussian ellipsoids -->
  <g opacity="0.8">
    <ellipse cx="240" cy="150" rx="90" ry="35" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <ellipse cx="240" cy="150" rx="35" ry="90" fill="none" stroke="#34d399" stroke-width="2"/>
    <ellipse cx="240" cy="150" rx="65" ry="65" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="5 5"/>
    
    <!-- Rendered splats -->
    <ellipse cx="190" cy="130" rx="18" ry="8" fill="#f43f5e" opacity="0.8" transform="rotate(-25 190 130)"/>
    <ellipse cx="280" cy="140" rx="22" ry="10" fill="#38bdf8" opacity="0.8" transform="rotate(35 280 140)"/>
    <ellipse cx="240" cy="170" rx="24" ry="11" fill="#facc15" opacity="0.8" transform="rotate(10 240 170)"/>
    <ellipse cx="220" cy="100" rx="16" ry="7" fill="#c084fc" opacity="0.8" transform="rotate(-40 220 100)"/>
  </g>

  <!-- Camera rays -->
  <polygon points="60,220 160,160 160,210" fill="#ffffff" fill-opacity="0.1" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="45" y="215" width="22" height="16" rx="3" fill="#10b981"/>

  <rect x="15" y="15" width="115" height="24" rx="4" fill="#047857"/>
  <text x="72" y="31" fill="#ecfdf5" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">CVPR 2025</text>
</svg>
