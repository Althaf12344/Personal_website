<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#p2bg)"/>

  <!-- Robot Arm Kinematics & Trajectory -->
  <path d="M 90 230 L 140 160 L 220 120 L 290 145" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="230" r="14" fill="#71717a"/>
  <circle cx="140" cy="160" r="10" fill="#fbbf24"/>
  <circle cx="220" cy="120" r="10" fill="#fbbf24"/>
  <circle cx="290" cy="145" r="8" fill="#ef4444"/>

  <!-- Policy Rollout Curve -->
  <path d="M 290 145 C 330 110, 360 130, 410 180" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="410" cy="180" r="12" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="410" y="184" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">★</text>

  <!-- Value Map Grid lines -->
  <g stroke="#3f3f46" stroke-width="1" opacity="0.6">
    <line x1="50" y1="240" x2="430" y2="240"/>
    <line x1="50" y1="260" x2="430" y2="260"/>
    <line x1="80" y1="230" x2="80" y2="270"/>
    <line x1="180" y1="230" x2="180" y2="270"/>
    <line x1="280" y1="230" x2="280" y2="270"/>
    <line x1="380" y1="230" x2="380" y2="270"/>
  </g>

  <rect x="15" y="15" width="105" height="24" rx="4" fill="#065f46"/>
  <text x="67" y="31" fill="#ecfdf5" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">ICLR 2026</text>
</svg>
